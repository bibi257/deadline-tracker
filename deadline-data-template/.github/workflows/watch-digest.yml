name: 朝の通知の見張り

# GitHub の定期実行は混雑時に遅れるだけでなく、まれに丸ごと飛ばされる。
# そうなると朝の通知は「失敗」にもならず、ただ届かない（notify-failure では拾えない）。
# 午前中に一度、今朝の定期実行が作られたかを確かめ、無ければ Discord に知らせて朝の通知を送り直す。
on:
  schedule:
    - cron: "47 1 * * *"   # UTC 1:47 = JST 10:47（朝 6:47 の回が数時間遅れても間に合う時刻）
  workflow_dispatch:

permissions:
  actions: write   # 実行履歴の確認と、朝の通知の送り直し（workflow_dispatch）に使う

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 今朝の定期実行があったか確かめる
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 今日の JST 0時を UTC で表す（実行の作成日時は UTC で絞り込む）
          since=$(date -u -d "@$(TZ=Asia/Tokyo date -d 'today 00:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-digest.yml/runs?event=schedule&created=%3E%3D${since}" --jq '.total_count')
          if [ "$n" -gt 0 ]; then
            echo "今朝の定期実行: ${n}件（${since} 以降）。問題なし"
            exit 0
          fi
          echo "今朝の定期実行が見つかりません（${since} 以降）。送り直します"
          gh workflow run daily-digest.yml --repo "$GITHUB_REPOSITORY" -f mode=daily -f dry_run=false
          [ -n "$URL" ] || exit 0
          jq -n --arg c "⏰ 今朝 6:47 の締切通知が GitHub 側で実行されていなかったため、いま送り直します。" '{content: $c}' \
            | curl -sf --retry 3 --retry-delay 2 -H "Content-Type: application/json" -d @- "$URL" >/dev/null

  notify:
    needs: [watch]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      note: "朝の通知が届いたかどうか確かめられませんでした。"
    secrets: inherit
