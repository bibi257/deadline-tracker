name: 締切ダイジェストをDiscordへ送る

on:
  schedule:
    # UTC 21:47 = JST 6:47（毎朝）。GitHubのcronは混雑時に遅れるため、
    # 予定時刻の少し前かつ「0分ちょうど」を避けた時刻にしている。
    # （時刻を変える場合: JST = UTC + 9時間）
    - cron: "47 21 * * *"
    # UTC 12:45 日曜 = JST 21:45 日曜（週次レビュー）
    - cron: "45 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "送信モード"
        type: choice
        options: [daily, weekly]
        default: daily
      dry_run:
        description: "送信せずにログへ表示だけする（動作確認用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: ダイジェストを送信
        # 設定（WebhookURL・ユーザーID・アプリURL・対象日数・バックアップ曜日）は
        # .github/scripts/send_digest.sh の冒頭にまとめてある。
        # Secret「DISCORD_WEBHOOK_URL」を登録すると、スクリプト内のURLより優先される。
        # .icsの生成には同じフォルダの build_ics.py を使う（python3はrunnerに標準搭載）
        # 日曜夜のcron、または手動実行でweeklyを選んだ場合は週次レビューを送る
        env:
          DIGEST_MODE: ${{ github.event.inputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "45 12 * * 0" ] || [ "$DIGEST_MODE" = "weekly" ]; then
            DIGEST_MODE=weekly bash .github/scripts/send_digest.sh
          else
            DIGEST_MODE=daily bash .github/scripts/send_digest.sh
          fi
