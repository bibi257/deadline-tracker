name: モーニングブリーフ用フィードを更新

# data.json から feed.json（未完了の締切の一覧）を作り、このリポジトリにコミットする。
# モーニングブリーフはこの非公開リポジトリの feed.json を読む（公開先へは出さない）。
on:
  push:
    branches: [main]
    paths: ["data.json", ".github/scripts/build_feed.py", ".github/workflows/build-feed.yml"]
  schedule:
    # 毎日 UTC 21:17 = JST 6:17。日付が変わった後の範囲で作り直す安全網
    # （feed.json は絶対日付だけを持つので、実行が遅れても前日の生成物で「今日」を判断できる）
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 同期が落ち着くまで待つ
        # アプリの同期が続けて届く間は、途中の回をここで取り消して最後の1回だけ走らせる
        if: github.event_name == 'push'
        run: sleep 45

      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: feed.json を作って、変わっていればコミットする
        # GITHUB_TOKEN による push は他のワークフローを起動しないので、ループにはならない。
        # アプリの同期が続けて届くと、先に走った回の feed.json と衝突することがある。
        # 古い data.json から作ったものを rebase で押し込むと内容が古いまま残るので、
        # 毎回 main の最新を取り直し、その data.json から作り直してから push する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/scripts/build_feed.py data.json feed.json
            if git ls-files --error-unmatch feed.json >/dev/null 2>&1 && git diff --quiet -- feed.json; then
              echo "feed.json に変更はありません"; exit 0
            fi
            git add feed.json
            git commit -q -m "モーニングブリーフ用フィードを更新"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "feed.json を push できませんでした" >&2
          exit 1
