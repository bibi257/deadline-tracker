name: モーニングブリーフ用フィードを更新

# data.json から feed.json（未完了の締切の一覧）を作り、このリポジトリにコミットする。
# モーニングブリーフはこの非公開リポジトリの feed.json を読む（公開先へは出さない）。
on:
  push:
    branches: [main]
    paths: ["data.json", ".github/scripts/build_feed.py"]
  schedule:
    # 毎日 UTC 21:17 = JST 6:17。日付が変わった後の範囲で作り直す安全網
    # （feed.json は絶対日付だけを持つので、実行が遅れても前日の生成物で「今日」を判断できる）
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: feed.json を作る
        run: python3 .github/scripts/build_feed.py data.json feed.json

      - name: 変わっていればコミットする
        # GITHUB_TOKEN による push は他のワークフローを起動しないので、ループにはならない。
        # アプリの同期と同時になった場合に備え、取り込み直して数回やり直す
        run: |
          if git ls-files --error-unmatch feed.json >/dev/null 2>&1 && git diff --quiet -- feed.json; then
            echo "feed.json に変更はありません"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -q -m "モーニングブリーフ用フィードを更新"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "feed.json を push できませんでした" >&2
          exit 1
