name: 締切をGmailへ送る（モーニングブリーフ用）

# feed.json の内容を自分宛てにメールで送り、モーニングブリーフ（Gmail を読める）に締切を渡す。
# 件名「【締切トラッカー】M/D（曜）の締切」。ブリーフは今日の日付の件名を探して読む。
# 定期実行は数時間遅れることがあるので、前日の夜（翌日分）と当日の早朝（当日分）の2回送る。
on:
  schedule:
    - cron: "23 11 * * 0-4"   # 日〜木 UTC 11:23 = JST 20:23 → 翌平日分
    - cron: "23 20 * * 0-4"   # 日〜木 UTC 20:23 = 月〜金 JST 5:23 → 当日分
  workflow_dispatch:
    inputs:
      target:
        description: "どの日の分を送るか"
        type: choice
        options: [auto, today, tomorrow]
        default: auto
      dry_run:
        description: "送信せずにログへ表示だけする"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 最新の data.json から feed を作る
        run: python3 .github/scripts/build_feed.py data.json "$RUNNER_TEMP/feed.json"

      - name: メールを送る
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET: ${{ github.event.inputs.target || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python3 .github/scripts/send_feed_mail.py "$RUNNER_TEMP/feed.json"
