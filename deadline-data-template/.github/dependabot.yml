# GitHub Actions のバージョンを最新に保つ。
# ワークフローは actions/checkout などを SHA で固定している（すり替え対策）ため、
# 放っておくと古いまま止まる。月に1回、新しい版があれば更新の PR が届く。
# PR では check.yml が走るので、緑なら取り込んでよい（Dependabot の PR には Secret が渡らないため、失敗の Discord 通知は出ない）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "actions"
