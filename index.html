<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ブラウザがHTMLを保持し続けないようにする（更新をすぐ反映させるため） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>締切トラッカー</title>
<meta name="description" content="課題・記事の締切を管理して、iPhoneのカレンダーに通知を渡すツール">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="締切">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EBEE;
  --card:#FFFFFF;
  --ink:#141820;
  --ink-2:#5A6472;
  --ink-3:#8D97A5;
  --rule:#C9CFD8;
  --red:#D22B2B;
  --blue:#1F46C8;
  --amber:#B87400;
  --mark:#E4EF5C;
  --routine:#0E8F7E;
  --radius:3px;
  --shadow:0 1px 0 rgba(20,24,32,.06), 0 2px 10px rgba(20,24,32,.05);
}
html[data-theme="dark"]{
  --paper:#101317;
  --card:#191D23;
  --ink:#E8EBEF;
  --ink-2:#9AA4B2;
  --ink-3:#6C7684;
  --rule:#2C333C;
  --red:#FF6B5E;
  --blue:#7EA0FF;
  --amber:#E2A33C;
  --mark:#B9C93A;
  --routine:#3FC9B4;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.num{font-family:"Oswald",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top);
}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-size:13px;font-weight:700;letter-spacing:.22em;margin:0}
.today{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.count{text-align:right;line-height:1}
.count b{font-family:"Oswald";font-size:30px;font-weight:600;display:block}
.count span{font-size:11px;color:var(--ink-2);letter-spacing:.1em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:none;padding:9px 12px;font-size:13px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---- filter ---- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:4px 12px;font-size:12.5px;white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---- list ---- */
.group-label{
  display:flex;align-items:center;gap:10px;margin:22px 0 8px;
  font-size:11px;letter-spacing:.16em;color:var(--ink-3)
}
.group-label::after{content:"";flex:1;height:1px;background:var(--rule)}
.card{
  position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  border-radius:var(--radius);padding:12px 14px 10px;margin-bottom:8px;box-shadow:var(--shadow)
}
.card.over{border-left-color:var(--red)}
.card.today{border-left-color:var(--red)}
.card.soon{border-left-color:var(--amber)}
.card.near{border-left-color:var(--blue)}
.card.done{opacity:.55}
.left{text-align:center;padding-top:2px}
.left .n{font-family:"Oswald";font-size:34px;font-weight:600;line-height:.9;display:block}
.left .u{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.card.over .left .n,.card.today .left .n{color:var(--red)}
.card.soon .left .n{color:var(--amber)}
.title{font-size:15.5px;font-weight:700;margin:0 0 2px;word-break:break-word}
.card.done .title{text-decoration:line-through}
.meta{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.cat{font-size:11px;border:1px solid var(--rule);border-radius:2px;padding:0 6px;color:var(--ink-2)}
.memo{font-size:12.5px;color:var(--ink-2);margin:6px 0 0;white-space:pre-wrap}
/* signature: 経過メーター */
.rail{height:3px;background:var(--rule);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--ink-3);width:0}
.card.near .rail i{background:var(--blue)}
.card.soon .rail i{background:var(--amber)}
.card.today .rail i,.card.over .rail i{background:var(--red)}
.card.over .rail{background:repeating-linear-gradient(-45deg,var(--red),var(--red) 2px,transparent 2px,transparent 5px)}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.act{
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  border-radius:2px;padding:3px 9px;font-size:12px
}
.act:hover{border-color:var(--ink-3);color:var(--ink)}
.act.primary{border-color:var(--blue);color:var(--blue)}
.act.danger:hover{border-color:var(--red);color:var(--red)}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.cal-head h2{margin:0;font-size:15px;font-weight:500;letter-spacing:.06em}
.cal-head .num{font-size:26px;font-weight:600;margin-right:4px}
.nav{border:1px solid var(--rule);background:var(--card);border-radius:2px;width:34px;height:30px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.dow{background:var(--paper);text-align:center;font-size:10.5px;padding:5px 0;color:var(--ink-3);letter-spacing:.06em}
.dow.sun{color:var(--red)}.dow.sat{color:var(--blue)}
.day{background:var(--card);min-height:60px;padding:4px 4px 5px;border:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.day.out{background:var(--paper);color:var(--ink-3)}
.day .d{font-family:"Oswald";font-size:13px;color:var(--ink-2)}
.day.is-today .d{background:var(--ink);color:var(--paper);border-radius:2px;padding:0 4px}
.day.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.dot{height:4px;border-radius:2px;background:var(--ink-3)}
.dot.over,.dot.today{background:var(--red)}.dot.soon{background:var(--amber)}.dot.near{background:var(--blue)}
.dot.done{background:var(--rule)}
.dot.span{opacity:.35;height:3px}
.dot.routine{background:var(--routine)}
.card.routine{border-left-color:var(--routine)}
.card.routine .rail i{background:var(--routine)}
.card.routine .left .n{color:var(--routine)}
.sel-title{margin:16px 0 6px;font-size:12px;letter-spacing:.12em;color:var(--ink-3)}

/* ---- misc ---- */
.empty{border:1px dashed var(--rule);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.notice{background:var(--mark);color:#141820;font-size:12.5px;padding:8px 12px;border-radius:2px;margin:12px 0}
.fab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  border:0;background:var(--ink);color:var(--paper);
  border-radius:999px;padding:13px 26px;font-size:14.5px;font-weight:700;letter-spacing:.06em;
  box-shadow:0 6px 22px rgba(20,24,32,.28)
}
html[data-theme="dark"] .fab{background:var(--ink);color:#101317}

/* ---- settings ---- */
.sec{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:14px;margin:12px 0}
.sec h3{margin:0 0 4px;font-size:13.5px;letter-spacing:.08em}
.sec p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:9px 10px
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#0C0F13}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag-line{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:2px;padding:2px 4px 2px 9px;font-size:12.5px}
.tag button{border:0;background:none;color:var(--ink-3);font-size:14px;line-height:1;padding:2px 4px}

/* ---- dialog ---- */
dialog{
  border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);
  padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 20px 60px rgba(0,0,0,.3)
}
dialog::backdrop{background:rgba(10,13,17,.45)}
.dlg-in{padding:18px 18px 16px}
.dlg-in h2{margin:0 0 14px;font-size:15px;letter-spacing:.08em}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{border:1px solid var(--rule);background:transparent;border-radius:2px;padding:9px 16px;font-size:14px}
.btn.fill{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
html[data-theme="dark"] .btn.fill{color:#101317}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);font-size:13px;padding:9px 16px;border-radius:3px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s
}
html[data-theme="dark"] .toast{color:#101317}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){
  .card{grid-template-columns:54px 1fr;gap:10px}
  .left .n{font-size:30px}
  .day{min-height:54px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-in">
      <div>
        <h1 class="brand">締切トラッカー</h1>
        <div class="today" id="todayLabel"></div>
      </div>
      <div class="count"><b class="num" id="cntNum">0</b><span id="cntLabel">7日以内</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="list" aria-selected="true">一覧</button>
      <button class="tab" role="tab" data-view="rep" aria-selected="false">定期予定</button>
      <button class="tab" role="tab" data-view="cal" aria-selected="false">カレンダー</button>
      <button class="tab" role="tab" data-view="done" aria-selected="false">完了</button>
      <button class="tab" role="tab" data-view="set" aria-selected="false">設定</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fabAdd">＋ 締切を登録</button>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form method="dialog" class="dlg-in" id="dlgForm">
    <h2 id="dlgTitle">締切を登録</h2>
    <label class="field"><span>タイトル</span><input type="text" id="fTitle" required maxlength="80" placeholder="例：情報理論レポート"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fSpan" style="width:auto">何日かにまたがる予定にする（試験期間・合宿など）
    </label>
    <div class="two" id="startRow" style="display:none">
      <label class="field"><span>開始日</span><input type="date" id="fStart"></label>
      <label class="field"><span>開始時刻</span><input type="time" id="fStartTime" value="09:00"></label>
    </div>
    <div class="two">
      <label class="field"><span id="dueLabel">締切日</span><input type="date" id="fDate" required></label>
      <label class="field"><span>時刻</span><input type="time" id="fTime" value="23:59" required></label>
    </div>
    <div class="two">
      <label class="field"><span>カテゴリ</span><select id="fCat"></select></label>
      <label class="field"><span>繰り返し</span><select id="fRep">
        <option value="none">なし</option><option value="weekly">毎週</option>
        <option value="biweekly">隔週</option><option value="monthly">毎月</option>
      </select></label>
    </div>
    <label class="field" id="repCountRow" style="display:none"><span>繰り返す回数（初回を含む）</span>
      <select id="fRepCount">
        <option value="4">4回</option><option value="8">8回</option>
        <option value="12">12回</option><option value="15" selected>15回</option>
        <option value="30">30回</option><option value="0">終わりを決めない</option>
      </select>
    </label>
    <label class="field"><span>メモ</span><textarea id="fMemo" maxlength="500" placeholder="提出先・条件など"></textarea></label>
    <div class="dlg-acts">
      <button class="btn" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="btn fill" value="save" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script>
(function(){
"use strict";

/* ========== 保存領域（localStorage が使えない環境ではメモリに退避） ========== */
var KEY="deadline-tracker-v1";
var mem={}, hasLS=false;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); hasLS=true; }catch(e){ hasLS=false; }
var store={
  get:function(k){ return hasLS?localStorage.getItem(k):(k in mem?mem[k]:null); },
  set:function(k,v){ if(hasLS){try{localStorage.setItem(k,v);}catch(e){toast("保存できませんでした（空き容量を確認してください）");}} else {mem[k]=v;} }
};

var db={items:[],categories:["課題","電大navi記事","その他"],settings:{dayHour:9,theme:"auto"}};
function load(){
  var raw=store.get(KEY); if(!raw) return;
  try{
    var d=JSON.parse(raw);
    if(d&&Array.isArray(d.items)) db.items=d.items;
    if(d&&Array.isArray(d.categories)&&d.categories.length) db.categories=d.categories;
    if(d&&d.settings) db.settings=Object.assign(db.settings,d.settings);
  }catch(e){}
}
function save(){ store.set(KEY,JSON.stringify(db)); }

/* ========== 日付ユーティリティ ========== */
function pad(n){ return (n<10?"0":"")+n; }
function toLocalISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseItemDate(it){ return new Date(it.due); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function daysBetween(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/86400000); }
var DOW=["日","月","火","水","木","金","土"];
function fmtDue(d){
  return (d.getMonth()+1)+"/"+d.getDate()+"（"+DOW[d.getDay()]+"） "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function statusOf(it){
  var now=new Date(), d=parseItemDate(it);
  if(d<now) return "over";
  var n=daysBetween(now,d);
  if(n<=0) return "today";
  if(n<=3) return "soon";
  if(n<=7) return "near";
  return "far";
}
function remainText(it){
  var now=new Date(), d=parseItemDate(it);
  if(d<now){
    var od=daysBetween(d,now);
    return {n:od===0?"—":od, u:od===0?"期限切れ":"日 超過"};
  }
  var n=daysBetween(now,d);
  if(n===0){
    var h=Math.max(0,Math.floor((d-now)/3600000));
    return {n:h, u:"時間後・今日"};
  }
  return {n:n, u:"日後"};
}

/* ========== .ics 生成 ========== */
function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function utc(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
}
function fold(line){ // RFC5545: 1行75オクテット以内。日本語があるのでバイト数で折る
  var out="", cur="", b=0;
  for(var i=0;i<line.length;i++){
    var cp=line.codePointAt(i), ch=line[i];
    if(cp>0xFFFF){ ch=line.substr(i,2); i++; }
    var n = cp<0x80?1 : cp<0x800?2 : cp<0x10000?3 : 4;
    if(b+n>72){ out+=cur+"\r\n "; cur=""; b=0; }
    cur+=ch; b+=n;
  }
  return out+cur;
}
function alarm(trigger,label){
  return ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(label),
          "TRIGGER;VALUE=DATE-TIME:"+utc(trigger),"END:VALARM"];
}
/* 繰り返し予定用。絶対時刻だと初回しか鳴らないので、相対時間で指定する。
   期間ありの予定は終了(=締切)基準、期間なしは開始(=締切)基準にする */
function relAlarm(minutesBefore,label,relatedEnd){
  return ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc(label),
          "TRIGGER"+(relatedEnd?";RELATED=END":"")+":-PT"+minutesBefore+"M","END:VALARM"];
}
function veventOf(it){
  var due=parseItemDate(it);
  // 期間指定があれば開始〜締切。無い場合は締切の30分前から締切までとし、
  // 締切時刻が予定の「終了」に来るようにする（日をまたいで見えるのを防ぐ）
  var begin=it.start?new Date(it.start):new Date(due.getTime()-30*60000);
  var end=due;
  var L=["BEGIN:VEVENT",
    "UID:"+it.id+"@deadline-tracker",
    "DTSTAMP:"+utc(new Date()),
    "SEQUENCE:"+(it.seq||0),
    "DTSTART:"+utc(begin),
    "DTEND:"+utc(end),
    "SUMMARY:"+esc(it.title),
    "CATEGORIES:"+esc(it.cat||"その他")];
  if(it.memo) L.push("DESCRIPTION:"+esc(it.memo));
  var repeating=!!(it.rep&&it.rep!=="none");
  if(repeating){
    var freq={weekly:"FREQ=WEEKLY",biweekly:"FREQ=WEEKLY;INTERVAL=2",monthly:"FREQ=MONTHLY"}[it.rep];
    if(freq) L.push("RRULE:"+freq+(it.repCount>0?";COUNT="+it.repCount:""));
  }

  if(repeating){
    // 毎回鳴らすため相対時間で指定する。締切＝予定の終了なので終了基準に揃える
    L=L.concat(relAlarm(7*24*60, it.title+"：あと1週間", true));
    L=L.concat(relAlarm(24*60,   it.title+"：明日が締切", true));
    var minsFrom9=(due.getHours()-db.settings.dayHour)*60+due.getMinutes();
    if(minsFrom9>0) L=L.concat(relAlarm(minsFrom9, it.title+"：今日が締切", true));
  } else {
    L=L.concat(alarm(new Date(due.getTime()-7*86400000), it.title+"：あと1週間"));
    L=L.concat(alarm(new Date(due.getTime()-86400000), it.title+"：明日が締切"));
    var dayOf=new Date(due.getFullYear(),due.getMonth(),due.getDate(),db.settings.dayHour,0,0);
    if(dayOf<due) L=L.concat(alarm(dayOf, it.title+"：今日が締切"));
  }
  L.push("END:VEVENT");
  return L;
}
function buildICS(items){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//deadline-tracker//JP","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  items.forEach(function(it){ L=L.concat(veventOf(it)); });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n";
}
function downloadICS(items,name){
  if(!items.length){ toast("書き出す締切がありません"); return; }
  var blob=new Blob([buildICS(items)],{type:"text/calendar;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=(name||"deadlines").replace(/[\\/:*?"<>|]/g,"_")+".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  toast("カレンダーファイルを書き出しました");
}

/* ========== 状態 ========== */
var view="list", filter="ALL", calRef=new Date(), selDay=null, editingId=null;
var main=document.getElementById("main");

function activeItems(){ return db.items.filter(function(i){ return !i.done; }); }
function sortByDue(a,b){ return new Date(a.due)-new Date(b.due); }

function h(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function escHtml(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ========== 描画 ========== */
function render(){
  var now=new Date();
  document.getElementById("todayLabel").textContent =
    now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日（"+DOW[now.getDay()]+"）";
  // ヘッダーの件数は締切のみを数える（定期予定は常時あるため除く）
  var onceOnly=activeItems().filter(function(i){ return !isRepeating(i); });
  var soon=onceOnly.filter(function(i){ var d=new Date(i.due); return d>=now && daysBetween(now,d)<=7; });
  var over=onceOnly.filter(function(i){ return new Date(i.due)<now; });
  if(view==="rep"){
    var reps=activeItems().filter(isRepeating);
    document.getElementById("cntNum").textContent=reps.length;
    document.getElementById("cntLabel").textContent="定期予定";
  }
  else if(over.length){ document.getElementById("cntNum").textContent=over.length; document.getElementById("cntLabel").textContent="期限切れ"; }
  else { document.getElementById("cntNum").textContent=soon.length; document.getElementById("cntLabel").textContent="7日以内"; }

  document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.dataset.view===view?"true":"false"); });
  document.getElementById("fabAdd").style.display = (view==="set")?"none":"";

  main.innerHTML="";
  if(!hasLS) main.appendChild(h('<div class="notice">この画面ではブラウザの保存領域が使えないため、入力内容は再読み込みで消えます。GitHub Pages に置けば端末内に保存されます。</div>'));
  if(view==="list") renderList();
  else if(view==="rep") renderRepeat();
  else if(view==="cal") renderCal();
  else if(view==="done") renderDone();
  else renderSettings();
}

function filterBar(){
  var bar=h('<div class="filters"></div>');
  var cats=["ALL"].concat(db.categories);
  cats.forEach(function(c){
    var b=h('<button class="chip">'+escHtml(c==="ALL"?"すべて":c)+'</button>');
    b.setAttribute("aria-pressed", filter===c?"true":"false");
    b.onclick=function(){ filter=c; render(); };
    bar.appendChild(b);
  });
  return bar;
}

function cardOf(it){
  var st=statusOf(it), r=remainText(it), d=parseItemDate(it);
  var created=it.created?new Date(it.created):new Date(d.getTime()-14*86400000);
  var total=Math.max(1, d-created), pass=Math.min(total, Math.max(0, Date.now()-created));
  var pct=it.done?100:Math.round(pass/total*100);
  var el=h('<article class="card '+st+(isRepeating(it)?" routine":"")+(it.done?" done":"")+'">'+
    '<div class="left"><b class="n num">'+escHtml(r.n)+'</b><span class="u">'+escHtml(r.u)+'</span></div>'+
    '<div class="body">'+
      '<h3 class="title">'+escHtml(it.title)+'</h3>'+
      '<div class="meta"><span class="cat">'+escHtml(it.cat||"その他")+'</span><span class="num">'+
      escHtml(it.start?(fmtDue(new Date(it.start))+" 〜 "+fmtDue(d)):fmtDue(d))+'</span>'+
      (it.rep&&it.rep!=="none"?'<span class="cat">'+({weekly:"毎週",biweekly:"隔週",monthly:"毎月"}[it.rep])+
        (it.repCount>0?" 残"+it.repCount+"回":"")+'</span>':"")+'</div>'+
      (it.memo?'<p class="memo">'+escHtml(it.memo)+'</p>':"")+
      '<div class="rail"><i style="width:'+pct+'%"></i></div>'+
      '<div class="acts"></div>'+
    '</div></article>');
  var acts=el.querySelector(".acts");
  function add(label,cls,fn){ var b=h('<button class="act '+(cls||"")+'">'+label+'</button>'); b.onclick=fn; acts.appendChild(b); }
  if(!it.done){
    add("完了にする","",function(){ complete(it); });
    add("カレンダーへ","primary",function(){ downloadICS([it], it.title); });
    add("編集","",function(){ openDialog(it); });
  } else {
    add("戻す","",function(){ it.done=false; save(); render(); });
  }
  add("削除","danger",function(){ if(confirm("「"+it.title+"」を削除します。よろしいですか？")){ db.items=db.items.filter(function(x){return x.id!==it.id;}); save(); render(); toast("削除しました"); } });
  return el;
}

function isRepeating(it){ return !!(it.rep&&it.rep!=="none"); }

function renderList(){
  main.appendChild(filterBar());
  // 繰り返しは「定期予定」タブに分けているため、ここでは除く
  var list=activeItems().filter(function(i){ return (filter==="ALL"||i.cat===filter)&&!isRepeating(i); }).sort(sortByDue);
  if(!list.length){
    main.appendChild(h('<div class="empty" style="margin-top:18px"><b>登録された締切はありません</b>下のボタンから最初の締切を登録してください。</div>'));
    return;
  }
  var now=new Date();
  var groups=[
    ["期限切れ", function(i){ return new Date(i.due)<now; }],
    ["今日・明日", function(i){ var n=daysBetween(now,new Date(i.due)); return n>=0&&n<=1; }],
    ["今週（7日以内）", function(i){ var n=daysBetween(now,new Date(i.due)); return n>1&&n<=7; }],
    ["これから", function(i){ return daysBetween(now,new Date(i.due))>7; }]
  ];
  var used={};
  groups.forEach(function(g){
    var arr=list.filter(function(i){ return !used[i.id]&&g[1](i); });
    arr.forEach(function(i){ used[i.id]=1; });
    if(!arr.length) return;
    main.appendChild(h('<div class="group-label">'+g[0]+'</div>'));
    arr.forEach(function(i){ main.appendChild(cardOf(i)); });
  });
  var all=h('<div style="margin:20px 0 0"><button class="act primary" style="padding:8px 14px">表示中の締切をまとめてカレンダーへ書き出す</button></div>');
  all.querySelector("button").onclick=function(){ downloadICS(list,"deadlines"); };
  main.appendChild(all);
}

function renderRepeat(){
  main.appendChild(filterBar());
  var list=activeItems().filter(function(i){ return (filter==="ALL"||i.cat===filter)&&isRepeating(i); }).sort(sortByDue);
  if(!list.length){
    main.appendChild(h('<div class="empty" style="margin-top:18px"><b>定期予定はありません</b>締切を登録するとき「繰り返し」を選ぶと、ここにまとまります。</div>'));
    return;

  var labels={weekly:"毎週",biweekly:"隔週",monthly:"毎月"};

function renderDone(){
  var list=db.items.filter(function(i){ return i.done; }).sort(sortByDue).reverse();
  main.appendChild(h('<div class="group-label">完了した締切</div>'));

function renderCal(){
  main.appendChild(filterBar());
  var y=calRef.getFullYear(), m=calRef.getMonth();
  var head=h('<div class="cal-head"><h2><span class="num">'+y+"."+pad(m+1)+'</span></h2><div class="row"></div></div>');
  var prev=h('<button class="nav">‹</button>'), today=h('<button class="nav" style="width:auto;padding:0 10px;font-size:12px">今月</button>'), next=h('<button class="nav">›</button>');
  prev.onclick=function(){ calRef=new Date(y,m-1,1); selDay=null; render(); };
  next.onclick=function(){ calRef=new Date(y,m+1,1); selDay=null; render(); };
  today.onclick=function(){ calRef=new Date(); selDay=null; render(); };
  head.querySelector(".row").append(prev,today,next);
  main.appendChild(head);

  var grid=h('<div class="grid"></div>');
  DOW.forEach(function(d,i){ grid.appendChild(h('<div class="dow'+(i===0?" sun":i===6?" sat":"")+'">'+d+'</div>')); });
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var gridEnd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+41,23,59,59);
  // 繰り返しは表示範囲ぶんだけ展開する
  var items=[];
  db.items.filter(function(i){ return filter==="ALL"||i.cat===filter; })
    .forEach(function(i){ items=items.concat(expandOccurrences(i, start, gridEnd)); });
  var todayKey=toLocalISO(new Date());

  // その日が「締切日」か「期間の途中」かを判定する
  function hitsOn(key){
    return items.filter(function(i){
      var dueKey=toLocalISO(new Date(i.due));
      if(dueKey===key) return true;
      if(!i.start) return false;
      return key>=toLocalISO(new Date(i.start)) && key<dueKey;
    });
  }

  for(var k=0;k<42;k++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+k);
    var key=toLocalISO(d);
    var day=h('<button class="day'+(d.getMonth()!==m?" out":"")+(key===todayKey?" is-today":"")+(selDay===key?" sel":"")+'"><span class="d">'+d.getDate()+'</span></button>');
    var hit=hitsOn(key);
    hit.slice(0,3).forEach(function(i){
      var isDue=(toLocalISO(new Date(i.due))===key);
      // 定期予定は緑、それ以外は緊急度の色。期間の途中は薄い帯にする
      var cls=i.done?"done":(isRepeating(i)?"routine":statusOf(i));
      day.appendChild(h('<span class="dot '+cls+(isDue?"":" span")+'"></span>'));
    });
    (function(key){ day.onclick=function(){ selDay=(selDay===key?null:key); render(); }; })(key);
    grid.appendChild(day);
  }
  main.appendChild(grid);

  if(selDay){
    var sel=hitsOn(selDay).sort(sortByDue);
    var dd=new Date(selDay+"T00:00:00");
    main.appendChild(h('<div class="sel-title">'+(dd.getMonth()+1)+"月"+dd.getDate()+"日（"+DOW[dd.getDay()]+"）の予定"+'</div>'));
    if(!sel.length) main.appendChild(h('<div class="empty">この日の締切はありません。</div>'));
    else sel.forEach(function(i){ main.appendChild(cardOf(i)); });
  } else {
    main.appendChild(h('<div class="sel-title">日付をタップすると、その日の予定が出ます</div>'));
  }
}

/* 締切データの保存先リポジトリ名。Privateリポジトリを推奨（下のREADME参照） */
var DATA_REPO_NAME="deadline-data";

/* 公開URL（例：bibi257.github.io/deadline-tracker/）からownerを推定する */
function guessRepoFromURL(){
  var host=location.hostname;
  var m=host.match(/^([^.]+)\.github\.io$/);
  if(!m) return {};
  return {owner:m[1], repo:DATA_REPO_NAME};
}

/* GitHubのContents APIでdata.jsonを作成/更新する */
function utf8ToBase64(str){
  var bytes=new TextEncoder().encode(str), bin="";
  bytes.forEach(function(b){ bin+=String.fromCharCode(b); });
  return btoa(bin);
}
function syncToGitHub(g,s5){
  var owner=g("ghOwner").value.trim(), repo=g("ghRepo").value.trim(),
      branch=g("ghBranch").value.trim()||"main", token=g("ghToken").value.trim();
  var statusEl=s5.querySelector("#ghStatus");
  if(!owner||!repo||!token){ statusEl.textContent="ユーザー名・リポジトリ名・トークンをすべて入力してください。"; return; }
  store.set("gh-sync", JSON.stringify({owner:owner,repo:repo,branch:branch}));
  if(g("ghRemember").checked){ store.set("gh-token", token); }
  else if(hasLS){ try{ localStorage.removeItem("gh-token"); }catch(e){} }
  statusEl.textContent="同期しています…";
  var api="https://api.github.com/repos/"+owner+"/"+repo+"/contents/data.json";
  var payload={items:db.items, categories:db.categories};
  var content=utf8ToBase64(JSON.stringify(payload,null,2));
  var headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"};

  // 現在のsha(ファイルの版番号)を取得する。キャッシュされた古いshaを送ると409になるため無効化する
  function fetchSha(){
    return fetch(api+"?ref="+encodeURIComponent(branch)+"&_="+Date.now(),
                 {headers:headers, cache:"no-store"})
      .then(function(res){
        if(res.status===404) return null; // まだ無い＝新規作成
        if(!res.ok) return res.json().then(function(e){ throw new Error(e.message||("HTTP "+res.status)); });
        return res.json().then(function(j){ return j.sha; });
      });
  }
  function put(sha){
    var body={ message:"締切データを同期（"+new Date().toLocaleString("ja-JP")+"）",
               content:content, branch:branch };
    if(sha) body.sha=sha;
    return fetch(api,{method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"},headers),
      body:JSON.stringify(body)});
  }

  fetchSha()
    .then(put)
    .then(function(res){
      if(res.status===409){ // 版が競合したら最新shaを取り直して1度だけやり直す
        return fetchSha().then(put);
      }
      return res;
    })
    .then(function(res){
      if(!res.ok) return res.json().then(function(e){ throw new Error(e.message||("HTTP "+res.status)); });
      statusEl.textContent="同期しました。次の朝のダイジェストから反映されます。";
      toast("GitHubに同期しました");
    })
    .catch(function(err){
      var m=err.message||"";
      var hint="";
      if(/does not match|conflict/i.test(m)) hint="別の端末から同期された可能性があります。もう一度押してください。";
      else if(/Bad credentials|401/i.test(m)) hint="トークンが正しくないか、期限切れです。";
      else if(/Not Found|404/i.test(m)) hint="リポジトリ名か、トークンのRepository accessの設定を確認してください。";
      else if(/403|permission|Resource not accessible/i.test(m)) hint="トークンの権限（Contents: Read and write）を確認してください。";
      statusEl.textContent="同期に失敗しました："+m+(hint?"　→ "+hint:"");
    });
}

/* ========== 登録・編集 ========== */
var dlg=document.getElementById("dlg"), dlgForm=document.getElementById("dlgForm");
function openDialog(item){
  editingId=item?item.id:null;
  document.getElementById("dlgTitle").textContent=item?"締切を編集":"締切を登録";
  var catSel=document.getElementById("fCat");
  catSel.innerHTML="";
  db.categories.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; catSel.appendChild(o); });
  if(item){
    var d=parseItemDate(item);
    document.getElementById("fTitle").value=item.title;
    document.getElementById("fDate").value=toLocalISO(d);
    document.getElementById("fTime").value=pad(d.getHours())+":"+pad(d.getMinutes());
    catSel.value=item.cat||db.categories[0];
    document.getElementById("fRep").value=item.rep||"none";
    document.getElementById("fRepCount").value=String(item.repCount==null?15:item.repCount);
    document.getElementById("fMemo").value=item.memo||"";
    var hasStart=!!item.start;
    document.getElementById("fSpan").checked=hasStart;
    if(hasStart){
      var s=new Date(item.start);
      document.getElementById("fStart").value=toLocalISO(s);
      document.getElementById("fStartTime").value=pad(s.getHours())+":"+pad(s.getMinutes());
    }
  } else {
    dlgForm.reset();
    var base=selDay?new Date(selDay+"T00:00:00"):new Date();
    document.getElementById("fDate").value=toLocalISO(base);
    document.getElementById("fTime").value="23:59";
    document.getElementById("fStart").value=toLocalISO(base);
    document.getElementById("fStartTime").value="09:00";
    document.getElementById("fRepCount").value="15";
    catSel.value=(filter!=="ALL"&&db.categories.indexOf(filter)>=0)?filter:db.categories[0];
  }
  syncDialogRows();
  dlg.showModal();
}

/* チェックや選択に応じて、関係のある入力欄だけを出す */
function syncDialogRows(){
  var span=document.getElementById("fSpan").checked;
  document.getElementById("startRow").style.display=span?"":"none";
  document.getElementById("dueLabel").textContent=span?"終了日":"締切日";
  var rep=document.getElementById("fRep").value;
  document.getElementById("repCountRow").style.display=(rep==="none")?"none":"";
}
document.getElementById("fSpan").addEventListener("change",syncDialogRows);
document.getElementById("fRep").addEventListener("change",syncDialogRows);

dlgForm.addEventListener("submit",function(e){
  var val=e.submitter?e.submitter.value:"save";
  if(val!=="save") return;
  var title=document.getElementById("fTitle").value.trim();
  var date=document.getElementById("fDate").value, time=document.getElementById("fTime").value||"23:59";
  if(!title||!date){ e.preventDefault(); return; }
  var due=new Date(date+"T"+time+":00");

  var start=null;
  if(document.getElementById("fSpan").checked){
    var sd=document.getElementById("fStart").value, st=document.getElementById("fStartTime").value||"09:00";
    if(sd){
      start=new Date(sd+"T"+st+":00");
      if(start>due){ e.preventDefault(); toast("開始が終了より後になっています"); return; }
    }
  }
  var rep=document.getElementById("fRep").value;
  var repCount=(rep==="none")?0:parseInt(document.getElementById("fRepCount").value,10);

  if(editingId){
    db.items.forEach(function(i){
      if(i.id!==editingId) return;
      i.title=title; i.due=due.toISOString(); i.cat=document.getElementById("fCat").value;
      i.rep=rep; i.repCount=repCount; i.memo=document.getElementById("fMemo").value.trim();
      if(start) i.start=start.toISOString(); else delete i.start;
      i.seq=(i.seq||0)+1;
    });
    toast("更新しました。通知を変えるには.icsを取り込み直してください");
  } else {
    var it={
      id:"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      title:title, due:due.toISOString(), cat:document.getElementById("fCat").value,
      rep:rep, repCount:repCount, memo:document.getElementById("fMemo").value.trim(),
      done:false, created:new Date().toISOString()
    };
    if(start) it.start=start.toISOString();
    db.items.push(it);
    toast(rep==="none"?"登録しました":"登録しました。繰り返しの回もカレンダーに出ます");
  }
  save(); render();
});

function complete(it){
  it.done=true; it.doneAt=new Date().toISOString();
  if(it.rep&&it.rep!=="none"){
    // 繰り返しはカレンダー側で先の回まで展開しているため、ここでは複製しない。
    // 「この回だけ完了」にすると次回以降が消えるので、締切日を次回へ進める。
    var n=nextOccurrence(parseItemDate(it), it.rep);
    var left=(it.repCount||0);
    if(left===0 || left>1){
      it.done=false; delete it.doneAt;
      if(it.start){
        var span=parseItemDate(it)-new Date(it.start);
        it.start=new Date(n.getTime()-span).toISOString();
      }
      it.due=n.toISOString();
      if(left>1) it.repCount=left-1;
      it.seq=(it.seq||0)+1;
      toast("完了。次回は "+fmtDue(n)+" です");
    } else {
      toast("繰り返しの最終回を完了しました");
    }
  } else {
    toast("完了にしました");
  }
  save(); render();
}

/* 繰り返し1回分だけ日付を進める */
function nextOccurrence(d, rep){
  var n=new Date(d);
  if(rep==="weekly") n.setDate(d.getDate()+7);
  else if(rep==="biweekly") n.setDate(d.getDate()+14);
  else if(rep==="monthly") n.setMonth(d.getMonth()+1);
  return n;
}

/* 表示用に、繰り返しの回を指定範囲まで展開する（保存はせず、その場で作る） */
function expandOccurrences(it, fromDate, toDate){
  var out=[];
  if(!it.rep||it.rep==="none"){ out.push(it); return out; }
  var d=parseItemDate(it);
  var span=it.start?(d-new Date(it.start)):0;
  var limit=(it.repCount&&it.repCount>0)?it.repCount:60; // 無期限でも60回で打ち切る
  for(var k=0;k<limit;k++){
    if(d>toDate) break;
    if(d>=fromDate){
      var copy=Object.assign({},it);
      copy.due=d.toISOString();
      if(it.start) copy.start=new Date(d.getTime()-span).toISOString();
      if(k>0){ copy.occurrence=k; copy.done=false; } // 2回目以降は未完了として扱う
      out.push(copy);
    }
    d=nextOccurrence(d, it.rep);
  }
  return out;
}

/* ========== テーマ・トースト ========== */
function applyTheme(){
  var t=db.settings.theme;
  if(t==="auto") t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.setAttribute("data-theme",t);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t==="dark"?"#101317":"#E9EBEE");
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){ if(db.settings.theme==="auto") applyTheme(); });

var toastEl=document.getElementById("toast"), toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove("on"); },2600);
}

/* ========== 更新の自動反映 ==========
   GitHub Pagesは古いHTMLを長く保持することがあるため、
   起動時と復帰時にサーバー側の更新を確認し、変わっていれば読み直す */
var APP_BUILD=null;
function checkForUpdate(){
  if(location.protocol==="file:") return;
  fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"})
    .then(function(res){ return res.ok?res.text():null; })
    .then(function(html){
      if(!html) return;
      // ファイル内容の長さを簡易な版番号として使う
      var build=html.length;
      if(APP_BUILD===null){ APP_BUILD=build; return; }
      if(build!==APP_BUILD){
        APP_BUILD=build;
        toast("新しい版が見つかりました。読み直します…");
        setTimeout(function(){ location.reload(); },1200);
      }
    })
    .catch(function(){});
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkForUpdate(); });

/* ========== 起動 ========== */
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){ view=t.dataset.view; window.scrollTo(0,0); render(); };
});
document.getElementById("fabAdd").onclick=function(){ openDialog(null); };
load(); applyTheme(); render();
setInterval(render, 60000); // 残り時間を更新
checkForUpdate();
setInterval(checkForUpdate, 10*60000); // 10分ごとに更新を確認
})();
</script>
