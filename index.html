<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 通信先と読み込み元を必要なものだけに絞る（トークン流出・外部スクリプト混入の対策）。
     script-src に 'unsafe-inline' は付けない：スクリプトはすべて app.js に置く。
     HTMLにインラインの <script> や onclick="..." などの属性を書くと動かなくなる（イベントは app.js で付ける）。
     style-src の 'unsafe-inline' は、画面を組み立てる style="..." の属性のために残している。
     外部へ通信する機能（GitHub同期・Discord送信・フォント）を足すときは、ここにも追加すること -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://discord.com https://discordapp.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
<!-- ブラウザがHTMLを保持し続けないようにする（更新をすぐ反映させるため） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ファイルを差し替えるたびに、この日時を更新する（設定タブに表示され、最新版かの判断に使う）。
     app.js を変えたときは、下の <script src="app.js?v=..."> の v も同じ日時（例 20261009-1019）に変える -->
<meta name="build-stamp" content="2026-10-09 11:11 JST">
<title>締切トラッカー</title>
<meta name="description" content="仕事や生活の締切を管理して、カレンダー通知とチャット通知に渡すツール">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="締切">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   締切トラッカー  ─  紙の手帳・台帳を下敷きにしたスタイル
   ・角は立てる（2px）／影・グラデーション・ぼかしは使わない
   ・階層は「罫線」と「文字の大きさ・書体」で作る
   ・状態色は状態にだけ使い、必ず記号＋文字の判子（stamp）と組にする
     （色は dataviz の validate_palette で紙色の地に対して検証済み）
   ===================================================================== */
:root{
  --paper:#F3F0E8;      /* 用紙 */
  --card:#FFFDF8;       /* 台帳の一枚 */
  --ink:#1C1B18;
  --ink-2:#5C5A52;
  --ink-3:#6E6B61;
  --rule:#D9D4C7;       /* 罫線 */
  --rule-2:#E8E3D6;     /* 細い補助罫 */
  /* 状態色：ライトは全検査合格（紙色 #FFFDF8 地） */
  --red:#C8203F;
  --amber:#B07C00;
  --blue:#2950D8;
  --routine:#0B8A7A;
  --mark:#F4E46A;       /* 蛍光ペン（今日の印） */
  --mark-ink:#1C1B18;
  --radius:2px;
  --sans:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --num:var(--sans);
}
html[data-theme="dark"]{
  --paper:#141311;
  --card:#1C1B18;
  --ink:#ECE8DE;
  --ink-2:#A8A396;
  --ink-3:#8F8A7F;
  --rule:#36332D;
  --rule-2:#2A2824;
  /* ダーク：赤↔琥珀の色覚差が注意域（ΔE 6.3）のため判子の記号＋文字を必ず併記 */
  --red:#EA4A62;
  --amber:#B8880E;
  --blue:#6286F0;
  --routine:#18A28D;
  --mark:#5E5622;
  --mark-ink:#F3EBC0;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* 蛍光ペンの印（今日） */

/* ---- 刊頭（ヘッダー） ---- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding-top:env(safe-area-inset-top);
  border-bottom:3px double var(--rule);
}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 0 10px}
.brand{font-family:var(--sans);font-weight:700;font-size:21px;font-weight:700;letter-spacing:.08em;margin:0;line-height:1.2}
.today{font-family:var(--num);font-size:13px;color:var(--ink-2);letter-spacing:.06em;margin-top:4px}
.count{text-align:right;line-height:1;border-left:1px solid var(--rule);padding-left:14px;flex-shrink:0;white-space:nowrap}
.count b{font-family:var(--num);font-size:34px;font-weight:600;display:block;letter-spacing:-.01em}
.count span{font-size:11px;color:var(--ink-2);letter-spacing:.12em}

/* 見出しタブ：1行で横に流す。選択中は下線 */
.tabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:0;background:none;padding:8px 10px 9px;font-size:13.5px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tab-badge{display:inline-block;margin-left:4px;background:var(--red);color:#fff;font-family:var(--num);font-size:10.5px;font-weight:600;line-height:1;padding:2px 4px;border-radius:var(--radius);vertical-align:1px}

/* ---- 絞り込み（カテゴリ） ---- */
.filters{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:14px 16px 2px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  border-radius:var(--radius);padding:3px 10px;font-size:12.5px;white-space:nowrap
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---- 一覧の見出し ---- */
.group-label{
  display:flex;align-items:baseline;gap:10px;margin:26px 0 8px;
  font-family:var(--sans);font-weight:700;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink)
}
.group-label::after{content:"";flex:1;border-bottom:1px solid var(--rule);transform:translateY(-4px)}

/* ---- 台帳の一枚（カード） ---- */
.card{
  position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink-3);
  border-radius:var(--radius);padding:12px 14px 11px;margin-bottom:8px
}
.card.over,.card.today{border-left-color:var(--red)}
.card.soon{border-left-color:var(--amber)}
.card.near{border-left-color:var(--blue)}
.card.routine{border-left-color:var(--routine)}
.card.stale{border-left-style:double;border-left-width:6px}
.card.done{border-left-color:var(--rule);background:transparent}
.left{text-align:center;padding-top:2px;border-right:1px dashed var(--rule-2);padding-right:12px;margin-right:-2px}
.left .n{font-family:var(--num);font-size:34px;font-weight:600;line-height:.95;display:block}
.left .n.word{font-family:var(--sans);font-size:20px;font-weight:700;line-height:1.2}
.left .u{display:block;margin-top:4px;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.card.over .left .n,.card.today .left .n{color:var(--red)}
.card.soon .left .n{color:var(--amber)}
.card.near .left .n{color:var(--blue)}
.card.routine .left .n{color:var(--routine)}
.card.routine.over .left .n,.card.routine.today .left .n{color:var(--red)}
.card.done .left .n{color:var(--ink-3)}
.title{font-size:15.5px;font-weight:700;margin:0 0 4px;line-height:1.45;word-break:break-word}
.card.done .title{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.meta{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.cat{font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.catg::before{content:"#";color:var(--ink-3);margin-right:1px}
/* 判子：枠と記号に状態色、文字はインク */
.badge{
  display:inline-flex;align-items:center;gap:3px;border:1px solid var(--ink-3);border-radius:var(--radius);
  padding:0 5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);line-height:1.6
}
.badge i{font-style:normal;font-size:10px}
.card.over .badge.st,.card.today .badge.st{border-color:var(--red)}
.card.over .badge.st i,.card.today .badge.st i{color:var(--red)}
.card.soon .badge.st{border-color:var(--amber)}
.card.soon .badge.st i{color:var(--amber)}
.card.near .badge.st{border-color:var(--blue)}
.card.near .badge.st i{color:var(--blue)}
.badge.rt{border-color:var(--routine)}
.badge.rt i{color:var(--routine)}
.badge.ok{border-color:var(--rule);color:var(--ink-3)}
.memo{font-size:12.5px;color:var(--ink-2);margin:6px 0 0;white-space:pre-wrap;padding-left:8px;border-left:2px solid var(--rule-2)}
.stale-note{font-size:12px;color:var(--ink);margin:6px 0 0;line-height:1.5;padding-left:8px;border-left:2px solid var(--red)}
/* 経過メーター */
.rail{height:3px;background:var(--rule-2);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--ink-3);width:0;border-radius:2px}
.card.near .rail i{background:var(--blue)}
.card.soon .rail i{background:var(--amber)}
.card.today .rail i,.card.over .rail i{background:var(--red)}
.card.routine .rail i{background:var(--routine)}
.card.over .rail{background:repeating-linear-gradient(-45deg,var(--red) 0 1px,transparent 1px 4px)}
.card.done .rail i{background:var(--rule)}
/* 操作：主要な「完了」だけ塗り、他は文字ボタン */
.acts{display:flex;gap:2px 4px;flex-wrap:wrap;margin-left:-6px}
.act{border:0;background:transparent;color:var(--ink-2);border-radius:var(--radius);padding:3px 6px;font-size:12.5px}
.act:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.act.main{background:var(--ink);color:var(--paper);font-weight:700;padding:3px 10px;margin-right:4px}
.act.main:hover{text-decoration:none;opacity:.88}
.act.primary{color:var(--blue)}
.act.danger{color:var(--ink-3);margin-left:auto}
.act.danger:hover{color:var(--red)}

/* ---- クイック入力 ---- */
.quick{display:flex;gap:0;margin:16px 0 0;border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--card)}
.quick input{flex:1;min-width:0;border:0!important;background:transparent!important;padding:11px 12px;font-size:15px;border-radius:0!important}
.quick input:focus{outline:none;box-shadow:none}
.quick:focus-within{outline:2px solid var(--mark);outline-offset:1px}
.quick button{border:0;border-left:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:0 16px;font-weight:700;font-size:13px;white-space:nowrap}
.quick-prev{font-size:12px;color:var(--ink-2);margin:5px 2px 0;min-height:1.2em}
.quick-prev b{color:var(--ink)}
.quick-prev a{color:var(--ink-3)}
.quick-help{font-size:12px;color:var(--ink-2);border-left:2px solid var(--rule);padding:4px 0 4px 10px;margin:8px 0 0}
.quick-help code{font-size:11.5px;background:var(--card);border:1px solid var(--rule-2);padding:0 4px;border-radius:var(--radius)}

/* ---- 今日のサマリー（台帳の集計行） ---- */
.sum{margin:14px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.sum-head{display:flex;align-items:baseline;justify-content:space-between;width:100%;border:0;background:none;padding:8px 0;text-align:left}
.sum-head b{font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--ink)}
.sum-head span{font-size:12px;color:var(--ink-3)}
.sum-body{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0 0 10px}
.sum-cell{border:0;border-left:1px solid var(--rule);background:none;padding:2px 10px;text-align:left;min-width:0}
.sum-cell:first-child{border-left:0;padding-left:0}
.sum-cell:hover small{color:var(--ink)}
.sum-cell .num{display:block;font-size:28px;font-weight:600;line-height:1.1}
.sum-cell small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.02em;line-height:1.35}
.sum-cell.hot .num{color:var(--red)}
.sum-cell.rt .num{color:var(--routine)}
.sum-list{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);margin:8px 0 0;padding:6px 0 0;list-style:none;border-top:1px dashed var(--rule)}
.sum-list li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){
  .sum-body{grid-template-columns:repeat(2,1fr);row-gap:8px}
  .sum-cell:nth-child(3){border-left:0;padding-left:0}
  .sum-cell .num{font-size:24px}
}

/* ---- カレンダー ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.cal-head h2{margin:0;font-size:15px;font-weight:500}
.cal-head .num{font-size:28px;font-weight:600;margin-right:4px}
.nav{border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);width:34px;height:30px;font-size:14px}
.nav:hover{border-color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.dow{text-align:center;font-size:11px;padding:5px 0;color:var(--ink-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-weight:700}
.dow.sun{color:var(--red)}.dow.sat{color:var(--blue)}
.day{background:var(--card);min-height:62px;padding:4px 4px 5px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);text-align:left;display:flex;flex-direction:column;gap:3px}
.day:hover{background:var(--paper)}
.day.out{background:transparent;color:var(--ink-3)}
.day .d{font-family:var(--num);font-size:13px;color:var(--ink-2);align-self:flex-start;padding:0 2px}
.day.is-today .d,.day.is-today.holiday .d{background:var(--ink);color:var(--card);font-weight:600;line-height:1;padding:2px 4px 1px}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.day.holiday .d{color:var(--red)}
.holname{font-size:8.5px;line-height:1.2;color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media (max-width:420px){.holname{display:none}}
.dot{height:4px;border-radius:1px;background:var(--ink-3)}
.dot.over,.dot.today{background:var(--red)}.dot.soon{background:var(--amber)}.dot.near{background:var(--blue)}
.dot.done{background:var(--rule)}
.dot.span{opacity:.4}
.dot.routine{background:var(--routine)}
.cal-opt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin:-4px 0 10px;cursor:pointer}
.cal-opt input{width:auto;margin:0;accent-color:var(--ink)}
.list-opt{margin:12px 0 0;width:max-content}
.sel-title{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}

/* ---- 今週 ---- */
.week{margin-top:14px;border-top:1px solid var(--ink)}
.wday{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.wday-head{padding-left:2px;display:flex;flex-wrap:wrap;align-items:baseline;align-content:flex-start;gap:0 3px}
.wday-head.tap{cursor:pointer}
.wday-head.tap:hover .num{text-decoration:underline;text-underline-offset:3px}
.wday-head .num{font-family:var(--num);font-size:18px;font-weight:600}
/* 今日：蛍光ペン風の帯は書体の上下余白で位置がずれるため、墨の反転ブロックにする */
.wday.is-today{border-left:3px solid var(--ink);padding-left:6px;background:var(--card)}
.wday.is-today .wday-head .num{display:inline-block;line-height:1;padding:3px 5px 2px;background:var(--ink);color:var(--card)}
.wday.is-today .wtag{border-color:var(--ink);color:var(--ink);font-weight:700}
.wday-head .wgo{font-size:11px;color:var(--ink-3)}
.wdow{font-size:11.5px;color:var(--ink-3)}
.wday-head.sun .num,.wday-head.sun .wdow{color:var(--red)}
.wday-head.sat .num,.wday-head.sat .wdow{color:var(--blue)}
.wtag{font-size:10.5px;border:1px solid var(--ink-3);color:var(--ink-2);border-radius:var(--radius);padding:0 4px;letter-spacing:.06em;margin-top:2px}
.wday-body{min-width:0}
.wnone{font-size:12px;color:var(--ink-3);padding:3px 0}
.witem{display:flex;align-items:baseline;gap:7px;padding:3px 4px;border-radius:var(--radius);cursor:pointer;min-width:0}
.witem:hover{background:var(--card)}
.wmark{flex-shrink:0;font-size:11px;color:var(--ink-3)}
.wtitle{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.wcat{font-size:10.5px;color:var(--ink-3);flex-shrink:0}
.wcat::before{content:"#"}
.wtime{font-size:12px;color:var(--ink-2);flex-shrink:0}
.witem.routine .wmark{color:var(--routine)}
@media (max-width:420px){ .wday{grid-template-columns:78px 1fr;gap:8px} .wcat{display:none} }

/* ---- 日表示（時間軸） ---- */
.dv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}
.dv-head h2{margin:0;font-size:15px;font-weight:500}
.dv-head h2 .num{font-size:26px;font-weight:600;margin-right:4px}
.dv-allday{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.dv-band{border:1px solid var(--rule);border-left:3px solid var(--ink-3);background:var(--card);border-radius:var(--radius);padding:3px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-band.routine{border-left-color:var(--routine)}
.dv-band small{color:var(--ink-3);margin-left:6px}
.dv-scroll{max-height:62vh;overflow-y:auto;border:1px solid var(--rule);border-top:1px solid var(--ink);background:var(--card)}
.dv-grid{position:relative;height:calc(24 * var(--hh));--hh:44px;margin-left:44px;border-left:1px solid var(--rule)}
.dv-hour{position:absolute;left:-44px;right:0;height:var(--hh);border-top:1px solid var(--rule-2);font-family:var(--num);font-size:11px;color:var(--ink-3);padding:1px 0 0 6px}
.dv-hour:first-child{border-top:0}
.dv-ev{
  position:absolute;box-sizing:border-box;border-radius:var(--radius);padding:1px 6px;font-size:12px;line-height:1.35;overflow:hidden;cursor:pointer;
  background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--ink-3);color:var(--ink)
}
.dv-ev.over,.dv-ev.today{border-left-color:var(--red)}
.dv-ev.soon{border-left-color:var(--amber)}
.dv-ev.near{border-left-color:var(--blue)}
.dv-ev.routine{border-left-color:var(--routine)}
.dv-ev b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-ev .num{font-size:11px;color:var(--ink-2)}
.dv-now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--red);z-index:2}
.dv-now::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;background:var(--red)}

/* ---- 空・お知らせ ---- */
.empty{border:1px dashed var(--rule);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-family:var(--sans);font-weight:700;font-size:15px;margin-bottom:4px}
.notice{background:var(--mark);color:var(--mark-ink);font-size:12.5px;padding:8px 12px;border-radius:var(--radius);margin:12px 0}

/* ---- 登録ボタン ---- */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  border:0;background:var(--ink);color:var(--paper);
  border-radius:var(--radius);padding:12px 24px;font-size:14.5px;font-weight:700;letter-spacing:.06em;
  box-shadow:0 0 0 4px var(--paper)
}
.fab:active{transform:translateX(-50%) translateY(1px)}

/* ---- 設定 ---- */
.sec{background:var(--card);border:1px solid var(--rule);border-top:2px solid var(--ink);border-radius:var(--radius);padding:14px;margin:14px 0}
.sec h3{margin:0 0 4px;font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.04em}
.sec p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:9px 10px
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:64px}
#searchBox{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag-line{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat-list{margin-bottom:12px}
.cat-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.cat-row:first-child{border-top:1px solid var(--rule-2)}
.cat-name{flex:1;font-size:13.5px;word-break:break-word}
.cat-btns{display:flex;gap:4px;flex-shrink:0}
.cat-btns .act{padding:2px 8px;font-size:13px;line-height:1.5;border:1px solid var(--rule)}
.rem-row .chip{padding:0 7px;font-size:11.5px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:var(--radius);padding:2px 4px 2px 9px;font-size:12.5px}
.tag button{border:0;background:none;color:var(--ink-3);font-size:14px;line-height:1;padding:2px 4px}
.skipbox{margin:-4px 0 12px;padding:8px 12px;border:1px solid var(--rule);border-top:0;border-radius:0 0 var(--radius) var(--radius);background:var(--card)}
.skipbox .act{border:1px solid var(--rule)}

/* ---- ダイアログ ---- */
dialog{
  border:1px solid var(--ink);border-radius:var(--radius);background:var(--card);color:var(--ink);
  padding:0;width:min(520px,calc(100% - 24px))
}
dialog::backdrop{background:rgba(20,19,17,.45)}
.dlg-in{padding:18px 18px 16px}
.dlg-in h2{margin:0 0 14px;font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.04em;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{border:1px solid var(--rule);background:transparent;border-radius:var(--radius);padding:8px 16px;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.fill{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
@media (max-width:520px){
  dialog{margin:auto 0 0;width:100%;max-width:100%;max-height:92vh;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}

/* ---- トースト ---- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);font-size:13px;padding:9px 14px;border-radius:var(--radius);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .15s;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px)
}
.toast.on{opacity:1;pointer-events:auto}
#toastAction{border:1px solid currentColor;background:none;color:inherit;border-radius:var(--radius);padding:4px 12px;font-size:13px;white-space:nowrap;flex-shrink:0;font-weight:700}
#toastAction:active{opacity:.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){
  .card{grid-template-columns:54px 1fr;gap:10px}
  .left{padding-right:8px}
  .left .n{font-size:30px}
  .left .n.word{font-size:17px}
  .day{min-height:54px}
  .brand{font-size:19px}
}

/* ---- 完了の演出（RPGのミッション達成風） ---- */
.card.clearing .body,.card.clearing .left{opacity:.45;transition:opacity .25s}
.card.folding{transition:height .3s ease,opacity .3s ease,margin .3s ease,padding .3s ease;height:0!important;opacity:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;overflow:hidden}
.quest{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,9,8,.28);animation:q-fade .2s both;cursor:pointer}
.quest.out{animation:q-fadeout .25s both}
.quest-band{position:relative;width:100%;padding:18px 16px 16px;text-align:center;color:#F4EEDC;background:#121110;
  border-top:2px solid #D9B44A;border-bottom:2px solid #D9B44A;box-shadow:0 0 0 4px #121110,0 0 0 5px #6E5A22;
  animation:q-band .38s cubic-bezier(.2,.9,.2,1) both;overflow:visible}
.quest-kicker{font-size:11px;letter-spacing:.42em;color:#D9B44A;font-weight:700;animation:q-up .3s .18s both}
.quest-title{font-size:30px;font-weight:700;letter-spacing:.12em;line-height:1.3;color:#FFE9A3;
  text-shadow:0 2px 0 #6E5A22,0 0 18px rgba(255,214,102,.45);animation:q-pop .45s .22s cubic-bezier(.2,1.6,.4,1) both}
.quest-name{font-size:14px;margin-top:4px;color:#F4EEDC;max-width:560px;margin-left:auto;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:q-up .3s .34s both}
.quest-sub{font-size:12px;color:#BDB6A3;animation:q-up .3s .38s both}
.quest-reward{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:8px;animation:q-up .3s .46s both}
.quest-exp{font-size:20px;font-weight:700;color:#7FE0B0;letter-spacing:.04em}
.quest-bonus{font-size:12px;color:#BDB6A3}
.quest-lv{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:#F4EEDC;font-variant-numeric:tabular-nums;animation:q-up .3s .52s both}
.quest-bar{width:160px;height:8px;border:1px solid #D9B44A;background:#2A2722;position:relative}
.quest-bar b{position:absolute;left:0;top:0;bottom:0;background:#D9B44A;width:var(--to);animation:q-bar .7s .6s ease-out both}
.quest-up{margin-top:8px;font-size:15px;font-weight:700;letter-spacing:.14em;color:#FFE9A3;animation:q-pop .45s 1s cubic-bezier(.2,1.6,.4,1) both}
.quest-sparks{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.quest-sparks i{position:absolute;width:7px;height:7px;margin:-3.5px;background:#FFE9A3;transform:rotate(45deg) scale(0);animation:q-spark .8s calc(.2s + var(--d)) ease-out both}
@keyframes q-fade{from{opacity:0}to{opacity:1}}
@keyframes q-fadeout{from{opacity:1}to{opacity:0}}
@keyframes q-band{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes q-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes q-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes q-bar{from{width:var(--from)}to{width:var(--to)}}
@keyframes q-spark{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(.4)}60%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(45deg) scale(1)}}
@media (max-width:420px){.quest-title{font-size:25px}.quest-bar{width:120px}}
/* 登録（クエスト受注）：完了の金に対して青緑の縁で区別する */
.quest.accept .quest-band{border-color:#3FC1A5;box-shadow:0 0 0 4px #121110,0 0 0 5px #1E5E52}
.quest.accept .quest-kicker{color:#3FC1A5}
.quest.accept .quest-title{color:#E6FFF7;text-shadow:0 2px 0 #1E5E52,0 0 18px rgba(63,193,165,.45)}
.quest.accept .quest-exp{color:#FFE9A3;font-size:17px}
.card.fresh{animation:card-in .5s cubic-bezier(.2,.9,.2,1) both,card-glow 1.6s .5s ease-out both}
@keyframes card-in{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes card-glow{0%{outline:2px solid var(--routine);outline-offset:2px}100%{outline:2px solid transparent;outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.quest,.quest *{animation:none!important}.card.folding{transition:none}.card.fresh{animation:none}}

/* ---- ヘッダーのレベル・連続日数・同期済み ---- */
.lvl{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;min-height:18px;font-variant-numeric:tabular-nums}
.lv-num{font-weight:700;color:var(--ink);letter-spacing:.04em}
.lv-num.up{animation:lv-up .9s cubic-bezier(.2,1.6,.4,1) both;color:var(--amber)}
.lv-gauge{width:84px;height:7px;border:1px solid var(--ink-3);position:relative;background:var(--card)}
.lv-gauge b{position:absolute;left:0;top:0;bottom:0;background:var(--amber);width:0}
.lv-gauge b.grow{transition:width .9s .2s ease-out}
.lv-streak{border:1px solid var(--rule);padding:0 5px;border-radius:var(--radius);color:var(--ink)}
.lv-streak.warn{border-color:var(--red);color:var(--red);animation:pulse-soft 1.8s ease-in-out infinite}
.sync-flash{color:var(--routine);font-weight:700;animation:q-up .25s both;transition:opacity .4s}
.sync-flash.out{opacity:0}
@keyframes lv-up{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.55}}

/* ---- 期限切れカードの脈動と、超過タブの ENEMY 印 ---- */
.card.over:not(.done){animation:over-pulse 2.4s ease-in-out infinite}
@keyframes over-pulse{0%,100%{border-left-color:var(--red)}50%{border-left-color:color-mix(in srgb,var(--red) 35%,var(--card))}}
body[data-view="over"] .card.over:not(.done) .left::before{content:"⚠ ENEMY";display:block;white-space:nowrap;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--red);margin-bottom:4px}

/* ---- カードを消す前の演出（延期・休み・削除） ---- */
.card.leaving{position:relative;overflow:hidden;pointer-events:none}
.card.ghost.postponing{animation:card-postpone .55s .15s ease-in both}
.card.skipping .title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ink-3)}
.card.ghost.skipping{animation:card-fade .5s .15s ease-in both}
.card.ghost.deleting{animation:card-shrink .3s ease-in both}
.out-stamp{position:absolute;right:18px;top:50%;margin-top:-22px;border:2px solid var(--ink-2);color:var(--ink-2);font-weight:700;font-size:16px;padding:6px 10px;transform:rotate(-8deg);background:var(--card);animation:q-pop .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes card-postpone{to{transform:translateX(60%);opacity:0}}
@keyframes card-fade{to{opacity:0;transform:scale(.98)}}
@keyframes card-shrink{to{opacity:0;transform:scale(.9)}}

/* ---- 本日のクエスト全クリア（虹色寄りの金） ---- */
.quest.allclear .quest-band{border-color:#FFD34D;box-shadow:0 0 0 4px #121110,0 0 0 5px #B98A16,0 0 40px rgba(255,211,77,.35)}
.quest.allclear .quest-title{font-size:clamp(19px,6.2vw,27px);letter-spacing:.06em;white-space:nowrap;color:#FFF3C4}
.quest.allclear .quest-exp{color:#FFD34D}

/* 演出「なし」・視差効果を減らす設定では、常時動くものも止める */
.no-motion .card.over:not(.done),.no-motion .lv-streak.warn,.no-motion .lv-num.up{animation:none}
@media (prefers-reduced-motion:reduce){.card.over:not(.done),.lv-streak.warn,.lv-num.up,.card.leaving{animation:none!important}.lv-gauge b.grow{transition:none}}

/* ---- カテゴリの色 ---- */
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip .sw{margin-right:6px}
.catg .sw{margin-right:4px}
.catg::before{display:none}
.witem .sw{align-self:center;margin-right:0}
.dv-ev.bycat{border-left-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--card))}
.cal-mode{gap:6px;cursor:default}
.cal-mode .chip{padding:1px 9px;font-size:11.5px}
.cpick{position:relative;display:inline-block}
.cp-cur{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);padding:3px 8px;font-size:12px;color:var(--ink-2);font-family:var(--sans);cursor:pointer}
.cp-cur .sw{width:12px;height:12px}
.cp-panel{margin-top:6px;padding:8px;border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);width:max-content;max-width:100%;box-sizing:border-box}
.cp-grid{display:grid;grid-template-columns:repeat(12,22px);gap:4px}
.cp-sw{width:22px;height:22px;border:0;border-radius:3px;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cp-sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.cp-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.cpick .cp-native{width:34px;height:30px;padding:0;border:1px solid var(--rule);background:none;flex:0 0 auto}
.cpick .cp-hex{width:104px;flex:0 0 auto;padding:5px 8px;font-family:var(--num);font-size:13px}
.cat-color{margin-right:8px}
.cat-row .cpick{flex-basis:auto}
@media (max-width:420px){.cp-grid{grid-template-columns:repeat(12,19px);gap:3px}.cp-sw{width:19px;height:19px}}

/* ---- 横に動かせる列（カテゴリ・タブ） ---- */
.hscroll{position:relative}
.hs-btn{position:absolute;top:0;bottom:0;z-index:2;width:40px;border:0;padding:0;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;display:none;align-items:center}
.hs-prev{left:-16px;justify-content:flex-start;padding-left:6px;background:linear-gradient(to right,var(--paper) 55%,transparent)}
.hs-next{right:-16px;justify-content:flex-end;padding-right:6px;background:linear-gradient(to left,var(--paper) 55%,transparent)}
.hscroll.can-l .hs-prev,.hscroll.can-r .hs-next{display:flex}
.hs-btn:hover{color:var(--red)}
.hscroll .filters{cursor:grab}
.hscroll.dragging .filters,.hscroll.dragging .tabs{cursor:grabbing;user-select:none}
.filters .chip{flex-shrink:0;white-space:nowrap}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-in">
      <div>
        <h1 class="brand">締切トラッカー</h1>
        <div class="today" id="todayLabel"></div>
        <div class="lvl" id="lvlBar" aria-live="polite"></div>
      </div>
      <div class="count"><b class="num" id="cntNum">0</b><span id="cntLabel">7日以内</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="list" aria-selected="true">一覧</button>
      <button class="tab" role="tab" data-view="week" aria-selected="false">今週</button>
      <button class="tab" role="tab" data-view="over" aria-selected="false">超過</button>
      <button class="tab" role="tab" data-view="rep" aria-selected="false">定期予定</button>
      <button class="tab" role="tab" data-view="cal" aria-selected="false">カレンダー</button>
      <button class="tab" role="tab" data-view="done" aria-selected="false">完了</button>
      <button class="tab" role="tab" data-view="set" aria-selected="false">設定</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fabAdd">＋ 締切を登録</button>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" style="display:none"></button></div>

<dialog id="dlg">
  <form method="dialog" class="dlg-in" id="dlgForm">
    <h2 id="dlgTitle">締切を登録</h2>
    <label class="field" id="tplRow" style="display:none"><span>テンプレートから入力</span>
      <select id="fTpl"></select>
    </label>
    <label class="field"><span>タイトル</span><input type="text" id="fTitle" required maxlength="80" placeholder="例：月次報告書の提出"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fSpan" style="width:auto">何日かにまたがる予定にする（出張・研修期間など）
    </label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fAllDay" style="width:auto">終日（時刻を決めない）
    </label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fAutoComplete" style="width:auto">期限を過ぎたら自動的に完了にする（超過として扱わない）
    </label>
    <div class="two" id="startRow" style="display:none">
      <label class="field"><span>開始日</span><input type="date" id="fStart"></label>
      <label class="field startTimeCell"><span>開始時刻</span><input type="time" id="fStartTime" value="09:00"></label>
    </div>
    <div class="two">
      <label class="field"><span id="dueLabel">締切日</span><input type="date" id="fDate" required></label>
      <label class="field dueTimeCell"><span>時刻</span><input type="time" id="fTime" value="09:00" required></label>
    </div>
    <p id="dayOffNote" style="display:none;font-size:12px;color:var(--amber);margin:-6px 0 12px"></p>
    <p id="overlapNote" style="display:none;font-size:12px;color:var(--amber);margin:-6px 0 12px"></p>
    <div class="two">
      <label class="field"><span>カテゴリ</span><select id="fCat"></select></label>
      <label class="field"><span>繰り返し</span><select id="fRep">
        <option value="none">なし</option><option value="weekly">毎週</option>
        <option value="biweekly">隔週</option><option value="monthly">毎月</option><option value="yearly">毎年</option>
      </select></label>
    </div>
    <div class="field" id="fColorField"><span>色（この締切だけ変える場合）</span><div id="fColorHost"></div></div>
    <label class="field" id="repCountRow" style="display:none"><span>繰り返す回数（初回を含む）</span>
      <select id="fRepCount">
        <option value="4">4回</option><option value="8">8回</option>
        <option value="12">12回</option><option value="15" selected>15回</option>
        <option value="30">30回</option><option value="0">終わりを決めない</option>
      </select>
    </label>
    <label id="calShowRow" style="display:none;gap:8px;align-items:center;font-size:13px;margin:-4px 0 12px">
      <input type="checkbox" id="fCalShow" style="width:auto" checked>カレンダーに帯を表示する（オフにしても日付を押すと一覧には出ます）
    </label>
    <label class="field"><span>メモ</span><textarea id="fMemo" maxlength="500" placeholder="提出先・必要書類・関係者など"></textarea></label>
    <div class="dlg-acts">
      <button class="btn" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="btn fill" value="save" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=20261009-1111"></script>
</body>
</html>
