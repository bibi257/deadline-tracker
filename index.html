<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 通信先と読み込み元を必要なものだけに絞る（トークン流出・外部スクリプト混入の対策）。
     外部へ通信する機能（GitHub同期・Discord送信・フォント）を足すときは、ここにも追加すること -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://discord.com https://discordapp.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<!-- ブラウザがHTMLを保持し続けないようにする（更新をすぐ反映させるため） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ファイルを差し替えるたびに、この日時を更新する（設定タブに表示され、最新版かの判断に使う） -->
<meta name="build-stamp" content="2026-10-09 13:54 JST">
<title>締切トラッカー</title>
<meta name="description" content="仕事や生活の締切を管理して、カレンダー通知とチャット通知に渡すツール">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="締切">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-in">
      <div>
        <h1 class="brand">締切トラッカー</h1>
        <div class="today" id="todayLabel"></div>
        <div class="lvl" id="lvlBar" aria-live="polite"></div>
      </div>
      <div class="count"><b class="num" id="cntNum">0</b><span id="cntLabel">7日以内</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="list" aria-selected="true">一覧</button>
      <button class="tab" role="tab" data-view="week" aria-selected="false">今週</button>
      <button class="tab" role="tab" data-view="over" aria-selected="false">超過</button>
      <button class="tab" role="tab" data-view="rep" aria-selected="false">定期予定</button>
      <button class="tab" role="tab" data-view="cal" aria-selected="false">カレンダー</button>
      <button class="tab" role="tab" data-view="done" aria-selected="false">完了</button>
      <button class="tab" role="tab" data-view="set" aria-selected="false">設定</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fabAdd">＋ 締切を登録</button>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" style="display:none"></button></div>

<dialog id="dlg">
  <form method="dialog" class="dlg-in" id="dlgForm">
    <h2 id="dlgTitle">締切を登録</h2>
    <label class="field" id="tplRow" style="display:none"><span>テンプレートから入力</span>
      <select id="fTpl"></select>
    </label>
    <label class="field"><span>タイトル</span><input type="text" id="fTitle" required maxlength="80" placeholder="例：月次報告書の提出"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fSpan" style="width:auto">何日かにまたがる予定にする（出張・研修期間など）
    </label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fAllDay" style="width:auto">終日（時刻を決めない）
    </label>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px">
      <input type="checkbox" id="fAutoComplete" style="width:auto">期限を過ぎたら自動的に完了にする（超過として扱わない）
    </label>
    <div class="two" id="startRow" style="display:none">
      <label class="field"><span>開始日</span><input type="date" id="fStart"></label>
      <label class="field startTimeCell"><span>開始時刻</span><input type="time" id="fStartTime" value="09:00"></label>
    </div>
    <div class="two">
      <label class="field"><span id="dueLabel">締切日</span><input type="date" id="fDate" required></label>
      <label class="field dueTimeCell"><span>時刻</span><input type="time" id="fTime" value="09:00" required></label>
    </div>
    <p id="dayOffNote" style="display:none;font-size:12px;color:var(--amber);margin:-6px 0 12px"></p>
    <p id="overlapNote" style="display:none;font-size:12px;color:var(--amber);margin:-6px 0 12px"></p>
    <div class="two">
      <label class="field"><span>カテゴリ</span><select id="fCat"></select></label>
      <label class="field"><span>繰り返し</span><select id="fRep">
        <option value="none">なし</option><option value="weekly">毎週</option>
        <option value="biweekly">隔週</option><option value="monthly">毎月</option><option value="yearly">毎年</option>
      </select></label>
    </div>
    <div class="field" id="fColorField"><span>色（この締切だけ変える場合）</span><div id="fColorHost"></div></div>
    <label class="field" id="repCountRow" style="display:none"><span>繰り返す回数（初回を含む）</span>
      <select id="fRepCount">
        <option value="4">4回</option><option value="8">8回</option>
        <option value="12">12回</option><option value="15" selected>15回</option>
        <option value="30">30回</option><option value="0">終わりを決めない</option>
      </select>
    </label>
    <label id="calShowRow" style="display:none;gap:8px;align-items:center;font-size:13px;margin:-4px 0 12px">
      <input type="checkbox" id="fCalShow" style="width:auto" checked>カレンダーに帯を表示する（オフにしても日付を押すと一覧には出ます）
    </label>
    <label class="field"><span>メモ</span><textarea id="fMemo" maxlength="500" placeholder="提出先・必要書類・関係者など"></textarea></label>
    <div class="dlg-acts">
      <button class="btn" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="btn fill" value="save" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
