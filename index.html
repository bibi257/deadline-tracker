<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 通信先と読み込み元を必要なものだけに絞る（トークン流出・外部スクリプト混入の対策）。
     script-src に 'unsafe-inline' は付けない：スクリプトはすべて app.js に置く。
     HTMLにインラインの <script> や onclick="..." などの属性を書くと動かなくなる（イベントは app.js で付ける）。
     CSS は styles.css に置き、<style> 要素は許さない（style-src-elem）。
     style="..." の属性も許さない（style-src-attr 'none'）。HTML に style 属性を書くと効かなくなる。
     固定の見た目は styles.css のクラスに置き、計算で決まる値（色・幅・位置）は data-st="プロパティ:値;…" で渡す（app.js の applyDyn が、要素ができてから CSSOM で付ける）。
     'unsafe-inline' は付けない：style-src-elem/attr を知らない古いブラウザでも、style 属性は許されない。
     外部へ通信する機能（GitHub同期・Discord送信・フォント）を足すときは、ここにも追加すること -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://discord.com https://discordapp.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<!-- ブラウザがHTMLを保持し続けないようにする（更新をすぐ反映させるため） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ファイルを差し替えるたびに、この日時を更新する（設定タブに表示され、最新版かの判断に使う）。
     app.js / styles.css を変えたときは、<script src="app.js?v=..."> / <link href="styles.css?v=..."> の v も同じ日時（例 20261009-1019）に変える。
     これは GitHub Pages（旧環境）用の手作業。Worker から配信する web/ は、ビルド（scripts/build.mjs）が v・スタンプ・キャッシュ名をハッシュで自動で書き換える。旧環境をやめたら、この手作業は不要 -->
<meta name="build-stamp" content="2026-10-31 14:00 メモ内チェックリスト（チェック欄と進み具合）">
<!-- アプリの版番号（設定の「バージョン」に「2026-10-31 08:00 v3.1」のように出る）。大きな変更のときに手で上げる。決め方は docs/VERSIONS.md。
     package.json の version（3.1.0）と major.minor をそろえる（テストで確かめる） -->
<meta name="app-version" content="3.3">
<title>締切トラッカー</title>
<meta name="description" content="仕事や生活の締切を管理して、カレンダー通知とチャット通知に渡すツール">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="締切">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261031-1400">
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-in">
      <div>
        <h1 class="brand">締切トラッカー</h1>
        <div class="today" id="todayLabel"></div>
        <div class="lvl" id="lvlBar" aria-live="polite"></div>
      </div>
      <div class="count"><b class="num" id="cntNum">0</b><span id="cntLabel">締切 7日以内</span><span class="sub" id="cntSub"></span></div>
      <button class="gear" id="gearBtn" type="button" aria-label="設定" title="設定" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <!-- 画面の切り替え。スマホでは画面の下に固定し、広い画面では見出しの下に並べる（styles.css）。
         超過・定期予定は一覧から、設定は右上のメニュー（☰）から開く -->
    <nav class="tabs" role="tablist" aria-label="画面">
      <button class="tab" role="tab" data-view="list" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="tab-name">一覧</span><span class="tab-badge" hidden></span></button>
      <button class="tab" role="tab" data-view="week" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="tab-name">今週</span></button>
      <button class="tab" role="tab" data-view="cal" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M9.2 10v10M14.8 10v10M3.5 15h17"/></svg><span class="tab-name">カレンダー</span></button>
      <button class="tab" role="tab" data-view="done" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="tab-name">完了</span></button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fabAdd">＋ 締切を登録</button>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<dialog id="dlg">
  <form method="dialog" class="dlg-in" id="dlgForm">
    <h2 id="dlgTitle">締切を登録</h2>
    <label class="field" id="tplRow" hidden><span>テンプレートから入力</span>
      <select id="fTpl"></select>
    </label>
    <label class="field"><span>タイトル</span><input type="text" id="fTitle" required maxlength="80" placeholder="例：月次報告書の提出"></label>
    <div class="two" id="startRow" hidden>
      <label class="field"><span>開始日</span><input type="date" id="fStart"></label>
      <label class="field startTimeCell"><span>開始時刻</span><input type="time" id="fStartTime" value="09:00"></label>
    </div>
    <div class="two">
      <label class="field"><span id="dueLabel">締切日</span><input type="date" id="fDate" required></label>
      <label class="field dueTimeCell"><span>時刻</span><input type="time" id="fTime" value="09:00" required></label>
    </div>
    <p id="dayOffNote" class="dlg-note" hidden></p>
    <p id="overlapNote" class="dlg-note" hidden></p>
    <label class="chk"><input type="checkbox" id="fAllDay">終日（時刻を決めない）</label>
    <div class="two">
      <label class="field"><span>カテゴリ</span><select id="fCat"></select></label>
      <label class="field"><span>繰り返し</span><select id="fRep">
        <option value="none">なし</option><option value="weekly">毎週</option>
        <option value="biweekly">隔週</option><option value="monthly">毎月</option><option value="yearly">毎年</option>
      </select></label>
    </div>
    <label class="field" id="repCountRow" hidden><span>繰り返す回数（初回を含む）</span>
      <select id="fRepCount">
        <option value="4">4回</option><option value="8">8回</option>
        <option value="12">12回</option><option value="15" selected>15回</option>
        <option value="30">30回</option><option value="0">終わりを決めない</option>
      </select>
    </label>
    <label class="field"><span>メモ</span><textarea id="fMemo" maxlength="500" placeholder="提出先・必要書類など。「- [ ] 手順」と書くと、カードでチェックできます"></textarea></label>
    <details class="dlg-more" id="dlgMore">
      <summary>詳しい設定</summary>
      <label class="chk"><input type="checkbox" id="fSpan"><span>期間の予定にする（開始日を決める）<small>出張・研修期間など</small></span></label>
      <label class="chk"><input type="checkbox" id="fAutoComplete"><span>締切を過ぎたら自動で完了にする<small>超過として扱いません</small></span></label>
      <div class="field" id="fColorField"><span>色（この締切だけ変える場合）</span><div id="fColorHost"></div></div>
      <label class="chk" id="calShowRow" hidden><input type="checkbox" id="fCalShow" checked><span>カレンダーに帯を表示する<small>オフにしても、日付を押すと一覧には出ます</small></span></label>
    </details>
    <div class="dlg-acts">
      <button class="btn" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="btn fill" value="save" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=20261031-1400"></script>
</body>
</html>
