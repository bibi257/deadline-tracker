# GitHub Actions のバージョンを最新に保つ。
# ワークフローは第三者のアクションをコミット SHA で固定している（タグの付け替えによるすり替え対策）ため、
# 放っておくと古いまま止まる。週に1回、新しい版があれば更新の PR が届く。内容と CI の結果を確かめてから取り込む。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
