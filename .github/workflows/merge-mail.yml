name: マージした変更を Gmail へ送る

# main への PR をマージしたとき、変更点（PR の説明・コミット・変更したファイル）を自分宛てにメールで送る。
# 送信には Secret の GMAIL_ADDRESS / GMAIL_APP_PASSWORD（deadline-data と同じ値）を使う。未設定なら送らない。
# PR を通さない直接の push では送らない。
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  mail:
    # 閉じただけ（マージせず）の PR では送らない
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得（マージ後の内容）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: メールを送る
        # PR のタイトルや説明は、ここで ${{ }} に埋め込まず、イベントの JSON からスクリプトで読む
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 .github/scripts/send_merge_mail.py "$GITHUB_EVENT_PATH"
