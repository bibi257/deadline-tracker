name: 締切ダイジェストをDiscordへ送る

on:
  schedule:
    # UTC 22:00 = JST 7:00。時刻を変えたい場合はここを編集(JST = UTC+9)
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行するためのボタン

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ダイジェストを送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/data.json
          WINDOW_DAYS: "7"
        run: bash scripts/send_digest.sh
